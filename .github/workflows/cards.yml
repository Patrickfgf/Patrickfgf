name: Generate Profile Cards

# Why: the public instances of github-readme-stats and streak-stats are queried at
# page-load time. When they are slow or down, GitHub's camo proxy returns 502/504 and
# caches the failure for hours, so the cards disappear from the profile. Generating the
# SVGs here and committing them makes the profile serve static files instead.
#
# Publishes to the `cards` branch, NOT `output` -- snake.yml force-pushes dist/ to
# `output`, so sharing a branch would make each workflow delete the other's artefact.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/gen_cards.py"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Seed dist with the currently published cards
        # The publish step force-pushes the whole build_dir, so any card that fails to
        # regenerate must already be in dist/ -- otherwise the force push deletes it
        # from the branch and the profile shows a 404 instead of a stale-but-valid card.
        run: |
          mkdir -p dist
          git fetch origin cards --depth=1 2>/dev/null || exit 0
          for card in stats.svg top-langs.svg streak.svg; do
            git show "origin/cards:$card" > "dist/$card" 2>/dev/null || rm -f "dist/$card"
          done
          ls -la dist

      - name: Generate cards
        env:
          # CARDS_TOKEN is a PAT with `repo` + `read:user`. Without it the run falls back
          # to GITHUB_TOKEN, which cannot see contributions in other private repos --
          # the cards would then report roughly a third of the real activity.
          CARDS_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
          CARDS_LOGIN: ${{ github.repository_owner }}
          CARDS_OUT: dist
        run: python scripts/gen_cards.py

      - name: Publish to cards branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: cards
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
